# 네이버 블로그 새 글을 홈페이지에 자동 반영 (6시간마다 + 수동 실행 가능)
name: 블로그 글 자동 가져오기
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RSS 읽기
        run: python scripts/fetch_blog.py
      - name: 바뀐 내용이 있으면 저장
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add files/blog.json
          git diff --cached --quiet || (git commit -m "블로그 글 목록 자동 업데이트" && git push)
