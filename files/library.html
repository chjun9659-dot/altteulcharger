<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자료실 — 알뜰차저</title>
  <style>
    :root {
      --navy: #1B3A4B;
      --teal: #2A8C6E;
      --teal-light: #3ab88f;
      --bg: #f5f7fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background: var(--bg); color: #333; min-height: 100vh; }

    /* 헤더 */
    header {
      background: var(--navy);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a.logo {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header a.logo span { color: #2A8C6E; }
    header a.home-btn {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .2s;
    }
    header a.home-btn:hover { color: white; }

    /* 본문 */
    .container {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 24px;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }

    /* 파일 목록 */
    #file-list { display: flex; flex-direction: column; gap: 12px; }

    .file-card {
      background: white;
      border-radius: 12px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: box-shadow .2s;
    }
    .file-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

    .file-info { display: flex; align-items: center; gap: 14px; }
    .file-icon {
      width: 44px; height: 44px;
      background: #fff0f0;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .file-icon svg { color: #e55; }
    .file-name { font-size: 15px; font-weight: 600; color: #222; word-break: break-all; }
    .file-meta { font-size: 12px; color: #999; margin-top: 3px; }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--teal);
      color: white;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .2s;
    }
    .dl-btn:hover { background: var(--teal-light); }

    /* 로딩 / 빈 상태 */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 32px;
      font-size: 12px;
      color: #bbb;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">알뜰<span>차저</span></a>
  <a href="/" class="home-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    홈으로
  </a>
</header>

<div class="container">
  <h1>📂 자료실</h1>
  <p class="subtitle">알뜰차저 관련 자료를 다운로드하실 수 있습니다.</p>
  <div id="file-list">
    <div class="state-msg">자료를 불러오는 중...</div>
  </div>
</div>

<footer>© 2025 주식회사 알뜰에너지솔루션. All rights reserved.</footer>

<script>
  // GitHub 저장소 정보
  const OWNER = 'chjun9659-dot';
  const REPO  = 'altteulcharger';
  const BRANCH = 'main';
  const FOLDER = 'files';

  // 파일 표시용 이름 정리 (확장자 제거, 언더스코어→공백)
  function prettyName(filename) {
    return filename.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
  }

  // 파일 확장자 아이콘 색상
  function fileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const colors = { pdf: '#e55', pptx: '#c55a11', docx: '#2b579a', xlsx: '#217346' };
    const c = colors[ext] || '#888';
    return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>`;
  }

  async function loadFiles() {
    const listEl = document.getElementById('file-list');
    try {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('불러오기 실패');
      const items = await res.json();

      // 자료실에서 숨길 파일 목록 (배경 이미지 등 내부용 파일)
      const HIDDEN_FILES = [
        'library.html',
        'hero_image.png',
        'about_bg.png',
        '남자모델_홈페이지 주소 포함.png',
        '여자모델_홈페이지 주소 포함.png',
      ];

      // .gitkeep 같은 숨김/관리 파일 + 내부용 파일 제외
      const files = items.filter(f =>
        f.type === 'file' &&
        !f.name.startsWith('.') &&
        !HIDDEN_FILES.includes(f.name)
      );

      if (files.length === 0) {
        listEl.innerHTML = '<div class="state-msg">등록된 자료가 없습니다.</div>';
        return;
      }

      listEl.innerHTML = files.map(f => `
        <div class="file-card">
          <div class="file-info">
            <div class="file-icon">${fileIcon(f.name)}</div>
            <div>
              <div class="file-name">${prettyName(f.name)}</div>
              <div class="file-meta">${f.name}</div>
            </div>
          </div>
          <a class="dl-btn" href="${f.download_url}" download="${f.name}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            다운로드
          </a>
        </div>
      `).join('');

    } catch (e) {
      listEl.innerHTML = '<div class="state-msg">자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
    }
  }

  loadFiles();
</script>
</body>
</html>
